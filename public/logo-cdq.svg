  <!-- Monogramma corsivo CdQ -->
  <text x="50" y="68" text-anchor="middle" font-family="'Caveat', 'Dancing Script', 'Brush Script MT', cursive, sans-serif" font-size="56" font-weight="700" font-style="italic" fill="currentColor" letter-spacing="-1">
    CdQ
  </text>
  
  <!-- Testo a destra -->
