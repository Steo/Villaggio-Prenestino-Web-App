    <script>
      // Disregistra i service worker e pulisce la cache in ambiente di sviluppo/preview per prevenire errori di chunk stale
      if (window.location.hostname.includes('ais-dev-') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var j = 0; j < keys.length; j++) {
              caches.delete(keys[j]);
            }
          });
        }
      }
    </script>
    <script>
      /* Self-healing loader per hosting Apache/cPanel:
         Se i file compilati vengono estratti senza la cartella 'assets' (es. estratti piatti in /app/),
         oppure viceversa, intercetta il 404 e carica automaticamente il file dalla posizione corretta. */
      (function() {
        var tried = {};
        window.addEventListener('error', function(e) {
          var el = e.target || e.srcElement;
          if (!el) return;
          var url = el.src || el.href;
          if (!url || tried[url]) return;
          tried[url] = true;

          // Se fallisce il caricamento da /assets/, prova la root
          if (url.indexOf('/assets/') !== -1) {
            var fallbackUrl = url.replace('/assets/', '/');
            if (el.tagName === 'SCRIPT') {
              var s = document.createElement('script');
              s.type = 'module';
              s.crossOrigin = 'anonymous';
              s.src = fallbackUrl;
              document.head.appendChild(s);
            } else if (el.tagName === 'LINK' && el.rel === 'stylesheet') {
              var l = document.createElement('link');
              l.rel = 'stylesheet';
              l.crossOrigin = 'anonymous';
              l.href = fallbackUrl;
              document.head.appendChild(l);
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
